[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plm-api"
version = "0.1.0"
description = "FastAPI backend for PLM"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.2.1",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.1.19",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
