name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first.
        **Security problems:** do not report them here – use the private process in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app (UI)
        - API
        - MCP / AI assistants
        - Telegram bot
        - Desktop app (OpenShell)
        - Docker / self-hosting
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Anamnesies?
      options:
        - Desktop app (installer)
        - Desktop app from a checkout (openshell)
        - Local development (npm / uvicorn)
        - Docker Compose
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: desktop-v0.1.0 or a commit hash
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
      placeholder: Windows 11, Chrome 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, passwords and personal data before posting.
      render: shell
