name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities (high or critical).
# Needs the dependency graph, which is free for public repositories; skipped while private.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
