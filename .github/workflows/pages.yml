name: Download page

# Publishes site/ (the download page) with GitHub Pages:
# https://robinssuperschmiede.github.io/PLM/
# Needs Settings → Pages → Source: GitHub Actions (once).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', 'assets/icon.png', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp assets/icon.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
