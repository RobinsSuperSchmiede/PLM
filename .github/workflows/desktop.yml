name: Desktop app

# Builds the desktop installers with OpenShell (`openshell package`, see openshell.json):
# Windows setup.exe, macOS .dmg (Apple Silicon), Linux .deb and .AppImage.
# - Run it by hand (Actions → Desktop app → Run workflow): the installers are attached to the run.
# - Push a tag `desktop-v0.1.0`: the installers also go into a draft release for that tag.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

env:
  # OpenShell release used to package the app (https://github.com/RobinsSuperSchmiede/EDA/releases).
  # v0.2.0 or newer: openshell.json uses window.title_bar.
  OPENSHELL_VERSION: v0.2.0

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for the bundler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the web app's packages (needed for its build)
        run: npm ci --no-audit --no-fund

      - name: Install OpenShell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="openshell-${{ matrix.target }}.${{ matrix.archive }}"
          mkdir -p "$RUNNER_TEMP/openshell" && cd "$RUNNER_TEMP/openshell"
          gh release download "$OPENSHELL_VERSION" -R RobinsSuperSchmiede/EDA -p "$file" -p SHA256SUMS.txt
          grep " $file\$" SHA256SUMS.txt | sha256sum -c -
          if [ "${{ matrix.archive }}" = "zip" ]; then unzip -q "$file"; else tar xzf "$file"; fi
          echo "$RUNNER_TEMP/openshell/openshell-${{ matrix.target }}" >> "$GITHUB_PATH"

      - name: Package
        run: |
          openshell --version
          openshell package --out dist

      - name: Attach installers to the run
        uses: actions/upload-artifact@v4
        with:
          name: anamnesies-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Anamnesies Desktop $tag" --notes "Installers built with OpenShell $OPENSHELL_VERSION." || true
          gh release upload "$tag" dist/* --clobber
