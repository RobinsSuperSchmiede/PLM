name: Desktop app

# Builds the desktop installers with OpenShell (`openshell package`, see openshell.json):
# Windows setup.exe, macOS .dmg (Apple Silicon), Linux .deb and .AppImage.
# - Run it by hand (Actions → Desktop app → Run workflow): the installers are attached to the run.
# - Push a tag `v0.2.0`: the installers are published as the release of that tag, under fixed names,
#   so https://github.com/RobinsSuperSchmiede/PLM/releases/latest/download/<name> always points to the
#   newest one (the download page in site/ links there). The tag sets the app's version.
#
# OpenShell comes from the releases of RobinsSuperSchmiede/EDA. While that repository is private, the
# secret OPENSHELL_TOKEN must hold a token that can read it (fine-grained: Contents read-only on EDA).
on:
  workflow_dispatch:
  push:
    tags: ['v*', 'desktop-v*']

permissions:
  contents: read

env:
  # OpenShell release used to package the app (https://github.com/RobinsSuperSchmiede/EDA/releases).
  OPENSHELL_VERSION: v0.2.1

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            label: Windows-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            label: macOS-AppleSilicon
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            label: Linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # The installed app downloads Python and Node.js on its first start when the machine has none
      # (scripts/runtimes). Check that the pinned downloads still work on this platform.
      - name: Portable Python and Node.js (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          PLM_DOWNLOAD_RUNTIMES: '1'
          OPENSHELL_DATA_DIR: ${{ runner.temp }}\plm-data
        run: |
          call apps\api\plm-python.cmd -c "import sys, venv; print(sys.version)" || exit /b 1
          cd apps\web && call plm-node.cmd scripts/npm.mjs --version || exit /b 1

      - name: Portable Python and Node.js
        if: runner.os != 'Windows'
        env:
          PLM_DOWNLOAD_RUNTIMES: '1'
          OPENSHELL_DATA_DIR: ${{ runner.temp }}/plm-data
        run: |
          apps/api/plm-python -c 'import sys, venv; print(sys.version)'
          cd apps/web && ./plm-node scripts/npm.mjs --version

      - name: Linux packages for the bundler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the web app's packages (needed for its build)
        run: npm ci --no-audit --no-fund

      - name: Install OpenShell
        env:
          GH_TOKEN: ${{ secrets.OPENSHELL_TOKEN || github.token }}
        run: |
          file="openshell-${{ matrix.target }}.${{ matrix.archive }}"
          mkdir -p "$RUNNER_TEMP/openshell" && cd "$RUNNER_TEMP/openshell"
          gh release download "$OPENSHELL_VERSION" -R RobinsSuperSchmiede/EDA -p "$file" -p SHA256SUMS.txt
          grep " $file\$" SHA256SUMS.txt | sha256sum -c -
          if [ "${{ matrix.archive }}" = "zip" ]; then unzip -q "$file"; else tar xzf "$file"; fi
          echo "$RUNNER_TEMP/openshell/openshell-${{ matrix.target }}" >> "$GITHUB_PATH"

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#desktop-}"; version="${version#v}"
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("openshell.json", "utf8"));
            config.app.version = process.argv[1];
            fs.writeFileSync("openshell.json", JSON.stringify(config, null, 2) + "\n");
          ' "$version"
          echo "app version $version"

      - name: Package
        run: |
          openshell --version
          openshell package --out dist

      # Fixed names, so the download page can link to releases/latest/download/<name>.
      - name: Name the installers
        run: |
          mkdir release
          for file in dist/*; do
            case "$file" in
              *.exe)      cp "$file" "release/Anamnesies-${{ matrix.label }}-Setup.exe" ;;
              *.dmg)      cp "$file" "release/Anamnesies-${{ matrix.label }}.dmg" ;;
              *.deb)      cp "$file" "release/Anamnesies-${{ matrix.label }}.deb" ;;
              *.AppImage) cp "$file" "release/Anamnesies-${{ matrix.label }}.AppImage" ;;
            esac
          done
          ls -l release
          [ -n "$(ls release)" ]

      - name: Attach installers to the run
        uses: actions/upload-artifact@v4
        with:
          name: anamnesies-desktop-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum Anamnesies-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Anamnesies ${tag#desktop-}" --generate-notes --latest --verify-tag
          gh release upload "$tag" release/* -R "$GITHUB_REPOSITORY" --clobber
